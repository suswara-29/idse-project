<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DATA QUEST: Become a Data Scientist!</title>
<style>
:root{--bg:#0b1020;--p:#151d3a;--p2:#1e2a52;--tx:#eaf0ff;--mu:#9db0d8;--a:#35e0c2;--b:#ffcb47;--r:#ff6b81}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1b2a66,#0b1020 60%) fixed;color:var(--tx);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;min-height:100vh}
#app{max-width:860px;margin:0 auto;padding:12px}
h1{font-size:44px;margin:.2em 0;color:var(--a);letter-spacing:2px}h3{margin:.8em 0 .2em;color:var(--b)}
.card{background:var(--p);border:1px solid var(--p2);border-radius:14px;padding:14px;margin:10px 0}
button{background:var(--a);color:#06241f;border:0;border-radius:10px;padding:9px 14px;margin:4px;font:700 15px inherit;cursor:pointer}
button.g{background:var(--p2);color:var(--tx)}button.chip{background:var(--p2);color:var(--tx);border:2px solid var(--a);font-weight:400}button.on{background:var(--b);color:#222}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--b)}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--p);border-radius:14px;padding:8px 12px}
.hud b{flex:1 1 200px}.bar{height:10px;background:var(--p2);border-radius:6px;flex:1 1 100%;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.toast{background:#123a36;border-left:6px solid var(--a);border-radius:10px;padding:10px 14px;margin:10px 0}.toast.bad{background:#3d1722;border-color:var(--r)}
.win{animation:pop .6s}@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--p2);padding:4px 6px;text-align:left}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.map button{min-height:70px}
.pad{display:flex;gap:4px;margin:6px 0}.pad button{flex:1;font-size:20px;touch-action:none}
input[type=range]{width:60%;max-width:300px;accent-color:var(--a)}textarea,select,input[type=text]{background:var(--bg);color:var(--tx);border:1px solid var(--p2);border-radius:8px;padding:6px;max-width:100%}
svg text{fill:var(--mu);font-size:11px}.big{font-size:56px;text-align:center;animation:pop 1s}
</style></head><body><div id="app"></div>
<script>
/* ===== DATA QUEST: helpers, state, shared UI ===== */
const $=s=>document.querySelector(s),ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[ri(0,a.length-1)],sh=a=>[...a].sort(()=>Math.random()-.5);
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,vr=a=>{const m=mean(a);return mean(a.map(x=>(x-m)**2))},med=a=>{const s=[...a].sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
const mode=a=>{const c={};a.forEach(x=>c[x]=(c[x]||0)+1);const m=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]==m).join(', ')};
const nr=(m,s)=>m+s*Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(6.2832*Math.random()),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const fresh=()=>({xp:0,coins:0,done:{},badges:[],ops:0,time:0,acc:0,rate:0,cm:'',rf:''});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem('dq')))}catch(e){S=fresh()}
let snd=1,t0=Date.now(),paused=0,M={train:[]};
const save=()=>{S.time+=Date.now()-t0;t0=Date.now();try{localStorage.setItem('dq',JSON.stringify(S))}catch(e){}};
const beep=f=>{if(!snd)return;try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();o.stop(a.currentTime+.1)}catch(e){}};
const op=()=>{S.ops++};
const say=(m,ok)=>{$('#fb').innerHTML=`<div class="toast ${ok===false?'bad':''}">${m}</div>`;beep(ok===false?200:600)};
function fin(i,m){if(!S.done[i]){S.done[i]=1;S.xp+=100;S.coins+=25;S.badges.push(ST[i].n)}save();beep(880);
 $('#fb').innerHTML=`<div class="toast win">🏅 ${m}<br><b>+100 XP, +25 coins, badge earned: ${ST[i].n}</b><br><button onclick="${i<9?`stage(${i+1})`:'end()'}">${i<9?'Next stage':'Restore DATA CITY'}</button></div>`}
const app=$('#app');
function menu(){document.onkeydown=null;const t=S.xp<300?'Rookie':S.xp<700?'Explorer':'Data Scientist';
 app.innerHTML=`<div class="card" style="text-align:center"><h1>DATA QUEST</h1><p><b>Become a Data Scientist!</b></p><p>DATA CITY has lost its intelligence because the DATA CORE is corrupted. Complete 10 missions to restore it.</p><p>Player title: <b>${t}</b> | XP <b>${S.xp}</b> | Coins <b>${S.coins}</b> | Badges <b>${S.badges.length}/10</b></p><button onclick="map()">Start Game</button><button class="g" onclick="how()">How to Play</button><button class="g" onclick="this.textContent='Sound: '+((snd=!snd)?'on':'off')">Sound: ${snd?'on':'off'}</button><button class="g" onclick="if(confirm('Reset all progress?')){S=fresh();save();menu()}">Reset progress</button></div>`}
function map(){document.onkeydown=null;app.innerHTML=`<div class="hud"><b>Choose a stage</b><span>XP ${S.xp}</span><button class="g" onclick="menu()">Menu</button></div><div class="map card">`+ST.map((s,i)=>{const lock=i>0&&!S.done[i-1];return `<button class="${S.done[i]?'':'g'}" ${lock?'disabled':''} onclick="stage(${i})">${S.done[i]?'✅':lock?'🔒':'▶'} ${i+1}. ${s.n}<br><small>${s.c}</small></button>`}).join('')+'</div>'}
function how(){app.innerHTML='<div class="hud"><b>How to Play</b><button class="g" onclick="menu()">Back</button></div>'+ST.map((s,i)=>`<div class="card"><h3>${i+1}. ${s.n}: ${s.c}</h3><p><b>Objective and controls:</b> ${s.o}</p><p><b>You will learn:</b> ${s.l}</p><p><b>In real life:</b> ${s.r}</p></div>`).join('')}
function stage(i){paused=0;document.onkeydown=null;app.innerHTML=`<div class="hud"><b>Stage ${i+1}: ${ST[i].n}</b><span>XP ${S.xp}</span><span>Coins ${S.coins}</span><button class="g" onclick="map()">Map</button><button class="g" onclick="stage(${i})">Restart</button><button class="g" onclick="paused=!paused;this.textContent=paused?'Resume':'Pause'">Pause</button><div class="bar"><i style="width:${Object.keys(S.done).length*10}%"></i></div></div><p><b>Objective:</b> ${ST[i].o}</p><div id="st"></div><div id="fb"></div>`;ST[i].run($('#st'))}
/* shared ML helpers: apple (y=0) vs orange (y=1) with weight w and redness c */
const fr=y=>y?{w:Math.round(cl(nr(190,28),110,260)),c:+cl(nr(.3,.2),0,1).toFixed(2),y:1}:{w:Math.round(cl(nr(150,28),90,230)),c:+cl(nr(.75,.2),0,1).toFixed(2),y:0};
const knn=(tr,p,k)=>{const s=tr.map(q=>({d:((q.w-p.w)/60)**2+((q.c-p.c)/.3)**2,y:q.y})).sort((a,b)=>a.d-b.d).slice(0,k);return s.reduce((a,b)=>a+b.y,0)*2>s.length?1:0};
const nm=f=>f.y?'🍊 orange':'🍎 apple';

/* ===== STAGE 1: Data Collection (canvas, keyboard movement) ===== */
function s1(el){el.innerHTML='<canvas id="cv" width="480" height="300" style="width:100%;max-width:480px;background:#12331f;border-radius:12px"></canvas><div class="pad">'+[['◀','arrowleft'],['▲','arrowup'],['▼','arrowdown'],['▶','arrowright']].map(([t,k])=>`<button data-k="${k}">${t}</button>`).join('')+'</div><div class="card" id="ds"></div>';
 const c=$('#cv'),g=c.getContext('2d'),K={};let p={x:240,y:150},D=[],noise=0,it=[];
 const T=[['🍎',1],['🌡️',1],['🦊',1],['🪨',0],['🗑️',0]];
 for(let i=0;i<24;i++){const t=T[i<16?i%3:3+i%2];it.push({e:t[0],r:t[1],x:ri(20,460),y:ri(30,280)})}
 const val=e=>e=='🍎'?ri(90,220)+' g':e=='🌡️'?ri(5,38)+' °C':pk(['fox','deer','owl']),typ=e=>e=='🍎'?'fruit weight':e=='🌡️'?'temperature':'animal sighting';
 document.onkeydown=e=>{const k=e.key.toLowerCase();K[k]=1;if(k.startsWith('arrow'))e.preventDefault()};document.onkeyup=e=>K[e.key.toLowerCase()]=0;
 const pad=el.querySelector('.pad');pad.onpointerdown=e=>{if(e.target.dataset.k)K[e.target.dataset.k]=1};pad.onpointerup=pad.onpointerleave=()=>['arrowleft','arrowup','arrowdown','arrowright'].forEach(k=>K[k]=0);
 const panel=()=>$('#ds').innerHTML=`<b>Live dataset: ${D.length}/10 relevant observations</b> (${noise} irrelevant items ignored)<table><tr><th>#</th><th>Variable</th><th>Value</th></tr>${D.slice(-6).map(r=>`<tr><td>${r.id}</td><td>${r.type}</td><td>${r.value}</td></tr>`).join('')}</table>`;
 const loop=()=>{if(!c.isConnected)return;if(!paused&&D.length<10){const s=3;if(K.arrowleft||K.a)p.x-=s;if(K.arrowright||K.d)p.x+=s;if(K.arrowup||K.w)p.y-=s;if(K.arrowdown||K.s)p.y+=s;p.x=cl(p.x,12,468);p.y=cl(p.y,15,288);
  it=it.filter(o=>{if(Math.hypot(o.x-p.x,o.y-p.y)>20)return true;
   if(o.r){D.push({id:D.length+1,type:typ(o.e),value:val(o.e)});op();D.length==10?fin(0,'Great! You collected 10 observations. In Data Science, gathering relevant observations is called DATA COLLECTION.'):say(`Collected: ${typ(o.e)}. Each observation becomes a row in your dataset. ${10-D.length} more to go.`)}
   else{noise++;say('That is irrelevant noise, so it does not belong in the dataset. Choosing relevant data matters.',false)}panel();return false});}
  g.clearRect(0,0,480,300);g.font='22px serif';g.textAlign='center';it.forEach(o=>g.fillText(o.e,o.x,o.y));g.font='28px serif';g.fillText('🧑‍🚀',p.x,p.y);requestAnimationFrame(loop)};
 panel();loop()}

/* ===== STAGE 2: Data Cleaning, discovered by play: keep the Weather Machine honest ===== */
function s2(el){const W=640,H=330;let rd=0,lives=3,tool=1,G;
 const mk=r=>{let sn=1,D=[];const ok=k=>{for(let i=0;i<k;i++)D.push({s:sn++,t:ri(20,30),k:'ok'})};ok(r==0?6:8);
  if(r==0)D.push({s:sn++,t:9999,k:'bad'},{s:sn++,t:-50,k:'bad'});
  if(r>=1)D.push({s:sn++,t:null,k:'blank'},{s:sn++,t:null,k:'blank'});
  if(r==1)D.push({s:sn++,t:9999,k:'bad'});
  let U=[];if(r==2){U=[{s:sn++,t:38,k:'ok'},{s:sn++,t:39,k:'ok'}];D.push(...U)}
  const L=sh(D);U.forEach(u=>{L.splice(Math.min(L.length,L.findIndex(x=>x.s==u.s)+ri(2,4)),0,{...u,k:'dup'})});
  return{L,truth:mean(D.filter(x=>x.k=='ok').map(x=>x.t))}};
 el.innerHTML=`<canvas id="cv" width="${W}" height="${H}" style="width:100%;max-width:${W}px;background:#0d1530;border-radius:12px;touch-action:none"></canvas><div class="pad"><button id="t1" class="on">🗑️ Throw away a card</button><button id="t2" class="g">🩹 Patch a gap</button></div>`;
 const c=$('#cv'),g=c.getContext('2d');
 const sel=n=>{tool=n;$('#t1').className=n==1?'on':'g';$('#t2').className=n==2?'on':'g'};$('#t1').onclick=()=>sel(1);$('#t2').onclick=()=>sel(2);
 document.onkeydown=e=>{if(e.key=='1')sel(1);if(e.key=='2')sel(2)};
 const start=()=>{const m=mk(rd);G={L:m.L,truth:m.truth,cards:[],acc:[],tk:0,nxt:0,end:0,log:{bad:[],blank:0,dup:[],lost:0}};
  say(['Round 1/3: reports roll toward the Weather Machine, which averages them. Keep the needle inside the green zone. Click a card to use the selected tool on it.','Round 2/3: some reports have gaps. Watch what the machine does with them.','Round 3/3: the busiest day. Watch the reports carefully.'][rd])};
 const mean2=()=>G.acc.length?mean(G.acc.map(a=>a.v)):0;
 const finish=()=>{G.end=1;const m=mean2(),ok=Math.abs(m-G.truth)<=1,lg=G.log;
  const why=[...lg.bad.map(v=>`a reading of ${v}°C got through`),...(lg.blank?[`${lg.blank} blank report(s) counted as 0°C`]:[]),...lg.dup.map(s=>`Station ${s} was counted twice`),...(lg.lost?[`you threw away ${lg.lost} good report(s)`]:[])].join('; ');
  const LRN=['Some reports were impossible, like 9999°C. Removing wrong values keeps results honest. This is DATA CLEANING.','Blank reports were counted as 0°C and dragged the needle down. Patching gaps with a typical value, or removing them, is part of DATA CLEANING.','A station that reports twice gets counted twice, which skews the average. Removing duplicates is part of DATA CLEANING.'][rd];
  if(ok){if(rd==2)fin(1,`Round 3 clear! ${LRN} You kept the machine honest in all 3 rounds.`);else{$('#fb').innerHTML=`<div class="toast win">⭐ Round ${rd+1} clear! ${LRN}<br><button id="nx">Next round</button></div>`;$('#nx').onclick=()=>{rd++;start()}}}
  else{lives--;$('#fb').innerHTML=`<div class="toast bad">The needle ended at ${m>=60?'off the scale':m.toFixed(1)+'°C'} but the real temperature is about ${G.truth.toFixed(1)}°C. ${why?'What happened: '+why+'.':''}<br>${lives>0?'<button id="rt">Retry round</button>':'No lives left. <button id="rt">Restart stage</button>'}</div>`;$('#rt').onclick=()=>lives>0?start():stage(1)}};
 const ingest=()=>{G.cards=G.cards.filter(o=>{if(o.x<W-125)return true;const v=o.t===null?0:o.t,twice=G.acc.some(a=>a.s==o.s);G.acc.push({s:o.s,v});
  if(o.k=='bad'){G.log.bad.push(o.t);say(`The machine swallowed ${o.t}°C and the needle jumped! Wrong readings poison the average.`,false)}
  else if(o.t===null){G.log.blank++;say('A blank report was counted as 0°C and the needle dropped!',false)}
  else if(twice){G.log.dup.push(o.s);say(`Station ${o.s} reported twice, so the machine counted it twice.`,false)}return false})};
 const draw=()=>{g.clearRect(0,0,W,H);g.fillStyle='#2a3558';g.fillRect(0,95,W,100);g.fillStyle='#7c5cff';g.fillRect(W-120,70,120,150);g.fillStyle='#fff';g.font='bold 14px sans-serif';g.textAlign='center';g.fillText('WEATHER',W-60,138);g.fillText('MACHINE',W-60,158);
  G.cards.forEach(o=>{g.fillStyle='#e8f0ff';g.fillRect(o.x,o.y,120,80);g.fillStyle='#12204a';g.textAlign='left';g.font='bold 14px sans-serif';g.fillText('Station '+o.s,o.x+8,o.y+24);g.font='13px sans-serif';g.fillText('10:00',o.x+8,o.y+44);g.font='bold 18px sans-serif';g.fillText(o.t===null?'—':o.t+'°C',o.x+8,o.y+68)});
  const X=v=>30+cl(v,0,60)/60*580,m=mean2();g.fillStyle='#1e2a52';g.fillRect(30,262,580,18);g.fillStyle='rgba(110,231,135,.6)';g.fillRect(X(G.truth-1),256,X(G.truth+1)-X(G.truth-1),30);g.fillStyle='#ffcb47';g.fillRect(X(m)-3,250,6,42);
  g.fillStyle='#eaf0ff';g.font='14px sans-serif';g.textAlign='left';g.fillText(`Machine says: ${m>=60?'off the scale!':m.toFixed(1)+'°C'}     Lives ${'❤'.repeat(Math.max(0,lives))}     Round ${rd+1}/3`,30,312);g.fillStyle='#9db0d8';g.font='13px sans-serif';g.fillText('Green zone = the real temperature. Stop bad reports before they reach the machine.',10,24)};
 const loop=()=>{if(!c.isConnected)return;if(!paused&&!G.end){G.tk++;const sp=1.2+.2*rd;if(G.nxt<G.L.length&&G.tk%Math.ceil(135/sp)==1)G.cards.push({...G.L[G.nxt++],x:-125,y:105});G.cards.forEach(o=>o.x+=sp);ingest();if(G.nxt>=G.L.length&&!G.cards.length)finish()}draw();requestAnimationFrame(loop)};
 c.onpointerdown=e=>{if(paused||G.end)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height,o=G.cards.find(o=>x>=o.x&&x<=o.x+120&&y>=o.y&&y<=o.y+80);if(!o)return;
  if(tool==1){const other=G.L.slice(G.nxt).concat(G.cards).some(q=>q!==o&&q.s==o.s);G.cards=G.cards.filter(q=>q!==o);op();if(o.k=='ok'&&!other){G.log.lost++;say('That report looked fine. Throwing away good readings leaves the machine with less data.',false)}else say('Thrown away! The machine will never see that report.')}
  else if(o.t===null){const v=G.acc.map(a=>a.v).filter(a=>a>0&&a<60);o.t=v.length?Math.round(med(v)):25;op();say(`Gap patched with a typical reading (${o.t}°C).`)}else say('Nothing to patch: this card already has a reading.',false)};
 start();loop()}

/* ===== STAGE 3: Data Organization: group falling cards into their columns ===== */
const PD=[['Asha','27 yrs','Pune','31°C'],['Ben','34 yrs','Delhi','22°C'],['Chen','41 yrs','Goa','29°C'],['Dia','23 yrs','Kochi','33°C']];
function s3(el){el.innerHTML=`<div class="card"><b>Group the data into columns.</b><p>Cards will fall from the top. Each card is one piece of information. Steer it into the column for its kind: <b>Name</b> with names, <b>Age</b> with ages, <b>City</b> with cities and <b>Temp</b> with temperatures.</p><p>Controls: ◀ ▶ (or A / D) to move, hold ▼ to drop faster. You have 3 lives.</p><button id="go">Start</button></div>`;
 $('#go').onclick=()=>s3b(el,()=>fin(2,'Shelf built! You grouped every piece of information into its column: names with names, ages with ages, cities with cities and temperatures with temperatures. Each column is one feature and each row is one record. This is DATA ORGANIZATION: a structured dataset.'))}
/* ===== Shelf builder mini-game (used by stage 3): steer falling cards into column lanes ===== */
function s3b(el,cb){const P=PD,cols=['Name','Age','City','Temp'],clr=['#35e0c2','#ffcb47','#ff6b81','#a78bfa'],W=480,H=380,K={};
 el.innerHTML=`<canvas id="cv" width="${W}" height="${H}" style="width:100%;max-width:${W}px;background:#0d1530;border-radius:12px"></canvas><div class="pad"><button data-k="a">◀</button><button data-k="s">▼ Drop</button><button data-k="d">▶</button></div><div class="card" id="tb"></div>`;
 const c=$('#cv'),g=c.getContext('2d'),T=P.map(()=>Array(4).fill(''));let Q=sh(P.flatMap((r,i)=>r.map((v,j)=>({v,j,i})))),cur=null,lane=1,lives=3,placed=0,over=0;
 const mv=k=>{if(k=='arrowleft'||k=='a')lane=Math.max(0,lane-1);if(k=='arrowright'||k=='d')lane=Math.min(3,lane+1)};
 document.onkeydown=e=>{const k=e.key.toLowerCase();mv(k);K[k]=1;if(k.startsWith('arrow'))e.preventDefault()};document.onkeyup=e=>K[e.key.toLowerCase()]=0;
 const pad=el.querySelector('.pad');pad.onpointerdown=e=>{const k=e.target.dataset.k;if(!k)return;mv(k);if(k=='s')K.s=1};pad.onpointerup=pad.onpointerleave=()=>K.s=0;
 const tb=()=>$('#tb').innerHTML=`<b>Your table: ${placed}/16 cells filled</b> (each colour is one record)<table><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr>${T.map((r,i)=>`<tr>${r.map(v=>`<td style="color:${clr[i]}">${v||'·'}</td>`).join('')}</tr>`).join('')}</table>`;
 const draw=()=>{g.clearRect(0,0,W,H);g.fillStyle='rgba(53,224,194,.12)';g.fillRect(lane*120,0,120,320);g.strokeStyle='#2a3558';for(let i=1;i<4;i++){g.beginPath();g.moveTo(i*120,0);g.lineTo(i*120,320);g.stroke()}
  g.setLineDash([6,6]);g.strokeStyle='#556';g.beginPath();g.moveTo(0,316);g.lineTo(W,316);g.stroke();g.setLineDash([]);
  cols.forEach((n,i)=>{g.fillStyle='#1e2a52';g.fillRect(i*120+4,326,112,44);g.fillStyle='#eaf0ff';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText(n,i*120+60,354)});
  g.textAlign='left';g.font='bold 15px sans-serif';g.fillStyle='#eaf0ff';g.fillText('Lives '+'❤'.repeat(Math.max(0,lives)),8,22);
  if(cur){const x=lane*120+10;g.fillStyle='#e8f0ff';g.fillRect(x,cur.y,100,44);g.fillStyle=clr[cur.i];g.beginPath();g.arc(x+14,cur.y+22,7,0,6.3);g.fill();g.fillStyle='#12204a';g.font='bold 16px sans-serif';g.fillText(cur.v,x+28,cur.y+28)}};
 const loop=()=>{if(!c.isConnected)return;if(!paused&&!over){if(!cur&&Q.length)cur={...Q.shift(),y:-44};
  if(cur){cur.y+=1.4+placed*.1+(K.arrowdown||K.s?5:0);if(cur.y>=270){
   if(lane==cur.j){T[cur.i][cur.j]=cur.v;placed++;op();tb();say(`Filled! "${cur.v}" is a ${cols[cur.j]}. Each column is a feature and each row is one record.`)}
   else{lives--;say(`Wrong column: "${cur.v}" is a ${cols[cur.j]}, not a ${cols[lane]}. The card goes back into the pile.`,false);Q.push({v:cur.v,j:cur.j,i:cur.i})}
   cur=null;if(placed==16){over=1;cb()}else if(lives<=0){over=1;$('#fb').innerHTML='<div class="toast bad">The shelf collapsed! Too many misfiled cards.<br><button onclick="stage(2)">Try again</button></div>'}}}}
  draw();requestAnimationFrame(loop)};
 tb();say('Cards are falling! Steer each into the lane of the column it belongs to (◀ ▶ or A / D). Hold ▼ to drop faster.');loop()}

/* ===== STAGE 4: Exploratory Data Analysis ===== */
